<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Page not found</title>
  <style>
    :root{--bg:#071017;--fg:#e6f7ff;--accent:#00e6ff}
    html,body{height:100%;margin:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center}
    .box{text-align:center;padding:28px;border-radius:12px;background:rgba(255,255,255,0.02);box-shadow:0 10px 30px rgba(0,0,0,0.6);max-width:720px}
    h1{margin:0 0 8px;font-size:36px}
    p{margin:6px 0}
    a{color:var(--accent);text-decoration:none;font-weight:700}
    .small{opacity:.8;font-size:14px;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h1>404 — Page not found</h1>
    <p>Sorry, the page you requested doesn't exist on this site.</p>
    <p><a href="/">Return to homepage</a></p>
    <p class="small">If you followed a broken link, please let me know.</p>
  </div>
</body>
</html>
