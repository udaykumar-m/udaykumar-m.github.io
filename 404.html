<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — Page not found</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://uday-kumar.com/css/style.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    .container-404 {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
      padding: 20px;
      flex-grow: 1;
    }

    .box {
      background: var(--panel-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 50px 60px;
      max-width: 950px;
      width: 100%;
      gap: 50px;
      transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .box {
        flex-direction: column;
        padding: 40px 25px;
        gap: 30px;
        max-width: 480px;
        margin-top: 20px;
        margin-bottom: 20px;
      }
    }

    .profile-section {
      flex: 0 0 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .glitch-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.25);
    }

    .glitch-img::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -5px;
      right: -5px;
      bottom: -5px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--neon-cyan);
      border-bottom-color: var(--neon-magenta);
      animation: spin 3.5s linear infinite;
      box-shadow: 0 0 15px var(--neon-cyan), inset 0 0 15px var(--neon-magenta);
      z-index: 1;
    }

    .glitch-img img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 2;
      border: 2px solid rgba(0, 255, 255, 0.2);
    }

    .content-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    @media (max-width: 768px) {
      .content-section {
        align-items: center;
        text-align: center;
      }
    }

    .glitch-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 90px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      line-height: 1;
      margin-bottom: 5px;
      text-shadow: 3px 3px 0px var(--neon-magenta);
    }

    @media (max-width: 768px) {
      .glitch-title {
        font-size: 70px;
      }
    }

    .subtitle {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-cyan);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
    }

    @media (max-width: 768px) {
      .subtitle {
        font-size: 16px;
        letter-spacing: 3px;
      }
    }

    .divider {
      height: 3px;
      width: 70px;
      background: var(--neon-cyan);
      margin-bottom: 25px;
      box-shadow: 0 0 10px var(--neon-cyan);
      border-radius: 2px;
    }

    .desc {
      font-size: 16px;
      color: #e0e0e0;
      line-height: 1.6;
      margin-bottom: 25px;
      max-width: 520px;
    }

    @media (max-width: 768px) {
      .desc {
        font-size: 14px;
      }
    }

    .info-box {
      border: 1px solid var(--neon-magenta);
      background: rgba(255, 0, 255, 0.04);
      box-shadow: inset 0 0 10px rgba(255, 0, 255, 0.05), 0 0 15px rgba(255, 0, 255, 0.05);
      border-radius: 8px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      margin-bottom: 30px;
      text-align: left;
      transition: all 0.3s ease;
    }

    .info-box:hover {
      box-shadow: inset 0 0 15px rgba(255, 0, 255, 0.1), 0 0 20px rgba(255, 0, 255, 0.1);
      border-color: var(--neon-magenta);
    }

    .info-icon-wrapper {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--neon-magenta);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--neon-magenta);
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.2);
      transition: all 0.3s ease;
    }

    .info-box:hover .info-icon-wrapper {
      background: rgba(255, 0, 255, 0.1);
      box-shadow: 0 0 12px rgba(255, 0, 255, 0.4);
    }

    .info-icon-wrapper i {
      transition: transform 0.4s ease;
    }

    .info-box:hover .info-icon-wrapper i {
      transform: rotate(45deg);
    }

    .info-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--neon-magenta);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-desc {
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .info-box {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 20px;
        gap: 10px;
      }
    }

    .actions {
      display: flex;
      gap: 20px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .actions {
        justify-content: center;
        flex-direction: column;
        gap: 15px;
      }
    }

    .btn {
      flex: 1;
      max-width: 220px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      border-radius: 5px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn i {
      font-size: 14px;
    }

    .btn-home {
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      background: rgba(0, 255, 255, 0.03);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
    }

    .btn-home:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 20px var(--neon-cyan);
    }

    .btn-projects {
      border: 1px solid var(--neon-magenta);
      color: var(--neon-magenta);
      background: rgba(255, 0, 255, 0.03);
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.1);
    }

    .btn-projects:hover {
      background: var(--neon-magenta);
      color: #000;
      box-shadow: 0 0 20px var(--neon-magenta);
    }

    @media (max-width: 768px) {
      .btn {
        max-width: 100%;
        width: 100%;
      }
    }

    .footer {
      position: relative;
      z-index: 10;
      padding: 20px 20px 30px;
      color: #777;
      font-size: 13px;
      font-family: 'Share Tech Mono', monospace;
      text-align: center;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="particles"></div>

  <div class="container-404">
    <div class="box">
      <!-- Left side: profile image -->
      <div class="profile-section">
        <div class="glitch-img">
          <img src="https://uday-kumar.com/img/uday.png" alt="Uday Kumar">
        </div>
      </div>

      <!-- Right side: details -->
      <div class="content-section">
        <h1 class="glitch glitch-title" data-text="404">404</h1>
        <div class="subtitle">PAGE NOT FOUND</div>
        <div class="divider"></div>
        <p class="desc">Oops! The page you're looking for seems to have wandered off into the digital void.</p>

        <!-- Info Alert Box -->
        <div class="info-box">
          <div class="info-icon-wrapper">
            <i class="fa fa-compass"></i>
          </div>
          <div class="info-text">
            <span class="info-title">Let's Get You Back</span>
            <span class="info-desc">Don't worry, even the best developers hit dead ends sometimes.</span>
          </div>
        </div>

        <!-- Actions Row -->
        <div class="actions">
          <a href="https://uday-kumar.com" class="btn btn-home">
            <i class="fa fa-arrow-left"></i> GO BACK HOME
          </a>
          <a href="https://uday-kumar.com#skills-projects" class="btn btn-projects">
            <i class="fa fa-code"></i> VIEW PROJECTS
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    &copy; <span id="year">2026</span> Uday Kumar. All rights reserved.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="/js/demo.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
